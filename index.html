<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Skillbuilder Characters</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="container">
    <div id="tabs"></div>
    <div id="content-area">
        <div id="content">Loading...</div>
        <div id="subtabs"></div>
        <div id="subcontent"></div>
    </div>
</div>

<script src="./primejudge.js"></script>
<script src="./disgrace.js"></script>

<script type="module">
import { hData, data } from "./content.js"
const CURRENT_VERSION = "1.0.0.0"

const TabsEm = document.getElementById("tabs");
const ContentEm = document.getElementById("content");
const SubTabsEm = document.getElementById("subtabs");
const SubContentEm = document.getElementById("subcontent");

function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function render(text) {
    const safe = escapeHtml(text);
    ContentEm.innerHTML = `<pre>${safe}</pre>`;
    SubTabsEm.innerHTML = "";
    subtabs.classList.add("no-subtabs");
    SubContentEm.innerHTML = "";
}

function renderSkill(contentblock, skill) {
    let append = ``;

    Object.keys(skill).forEach(key => {
        let item = skill[key];
        let properties = ``;
        let skilldata = ``;

        if (item.Properties) {
            Object.keys(item.Properties).forEach(propKey => {
            let prop = item.Properties[propKey];
            properties += `<div id="skillset-property" style="background: #020202;">${escapeHtml(prop)}</div>`;
        });
        }

        if (item.Data) {
            Object.keys(item.Data).forEach(dataKey => {
                let data = item.Data[dataKey];
                skilldata += `<div id="skillset-subdata">
                    <div id="skillset-subdata-title">${escapeHtml(dataKey)}</div>
                    <div id="skillset-subdata-content">${escapeHtml(data)}</div>
                </div>`;
            });
        }

        append += `
    <div id="skillset-block">
        <div id="skillset-content">
            <div id="skillset-top">
            <h2 id="skillset-title">
                <span class="mw-headline">
                    <span style="text-shadow: 0 0 5px ${item.NameColors.ShadowColor}; color: ${item.NameColors.Color};">
                        <b>${escapeHtml(item.Name)}</b>
                    </span>
                </span>
            </h2>
            <span id="skillset-tag" style="background: ${item.Tag.Color};">${escapeHtml(item.Tag.Text)}</span>
            </div>
            <div id="skillset-subcontent">
                <div id="skillset-demonstration">
                    <div id="skillset-demonstration-content">
                        <img src="./contents/noimage.jpg" alt=""></img>
                    </div>
                </div>
                <div id="skillset-subsubcontent">
                    <div id="skillset-descriptionblock">
                        <div id="skillset-description">${escapeHtml(item.Description)}</div>
                        <div id="skillset-flavortext">- ${escapeHtml(item.FlavorText)}</div>
                    </div>
                    <div id="skillset-propertyblock">
                        ${properties}
                    </div>
                </div>
            </div>
        </div>
        <div id="skillset-data">
            ${skilldata}
        </div>
    </div>`

    });

    contentblock.innerHTML = append;
} 

function createSkillBlock(key, skill) {
    const div = document.createElement("div");
    div.className = "skillblock";

    SubContentEm.appendChild(div);
    renderSkill(div, skill);
    return div;
}

function createSubTab(key, skillset) {
    const div = document.createElement("div");
    div.className = "subtab";
    div.textContent = key;
    div.dataset.key = key;

    div.onclick = () => {
        document.querySelectorAll(".subtab").forEach(t => t.classList.remove("active"));
        div.classList.add("active");

        let rawData = skillset || "Content not found";

            if (rawData) {
                SubContentEm.innerHTML = "";
                Object.keys(skillset).forEach(key => createSkillBlock(key, skillset[key]));
            } else {
            }
    };

    SubTabsEm.appendChild(div);
}

function renderCharacter(character) {
    const characterInfo = character.CharacterInfo;
    const skillset = character.Skillset;
    
    let append = `<div id="characterinfo-block">
        <div id="characterinfo-content">
            <div id="characterinfo-top">
                <h2 id="characterinfo-title">
                    <span style="text-shadow: 0 0 5px ${characterInfo.NameColors.ShadowColor}; color: ${characterInfo.NameColors.Color};">
                        <b>${escapeHtml(characterInfo.Name)}</b>
                    </span>
                </h2>
            </div>
            <div id="characterinfo-descriptionblock">
                <div id="characterinfo-description">${escapeHtml(characterInfo.Description)}</div>
                <div id="characterinfo-flavortext">- ${escapeHtml(characterInfo.FlavorText)}</div>
            </div>
            <div id="characterinfo-copyblock">
                <div id=${characterInfo.CCTag} class="characterinfo-copybutton">Copy</div>
             </div>
        </div>
    </div>`;

    ContentEm.innerHTML = append;

    ContentEm.querySelectorAll(".characterinfo-copybutton").forEach(button => {
        button.onclick = () => {
            const cctag = button.id;
            let text = hData.CCTags[cctag];

            if (text) {
                navigator.clipboard.writeText(text).then(() => {
                    alert("Character code copied to clipboard!");
                });
            }
            else {
                alert("Character code not found, "+cctag+".");
            }
        };
    });

    SubTabsEm.innerHTML = "";
    subtabs.classList.remove("no-subtabs");
    Object.keys(skillset).forEach(key => createSubTab(key, skillset[key]));

    const firstTab = SubTabsEm.querySelector(".subtab");
    if (firstTab) firstTab.click();
} 

function createTab(key) {
    const div = document.createElement("div");
    div.className = "tab";
    div.textContent = key;
    div.dataset.key = key;

    div.onclick = () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        div.classList.add("active");

        let rawData = data[key] || "Content not found";

            ContentEm.dataset.raw = rawData.Content;

            if (rawData.Skillset) {
                renderCharacter(rawData);
            } else {
                render(rawData.Content || "No content available.");
            }
    };

    TabsEm.appendChild(div);
}

Object.keys(data).forEach(key => createTab(key));

const firstTab = TabsEm.querySelector(".tab");
if (firstTab) firstTab.click();

</script>
</body>
</html>
